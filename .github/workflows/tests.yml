# Vraie matrice multi-Laravel : Laravel 12.x (testbench ^10.0) et Laravel
# 13.x (testbench ^11.0, PHP ^8.3 minimum).
#
# Laravel 11.x volontairement absent de cette matrice : au 2026-08-31, son
# support securite est termine (fin le 2026-03-12 — 18 mois de bug fixes puis
# 6 mois de securite en plus depuis la sortie, politique standard Laravel).
# Consequence verifiee ici : `composer require laravel/framework:^11.0` ne se
# resout plus du tout, TOUTES les versions 11.x etant desormais signalees par
# des advisories de securite Packagist (PKSA-*) — ce n'est pas une contrainte
# de version a affiner, il n'existe plus de version 11.x "propre" a tester.
# Le package continue d'accepter `illuminate/console|support|filesystem
# ^11.0` dans son `require` (ces sous-packages n'imposent pas laravel/framework
# et un projet deja en Laravel 11 garde son propre lock file), mais ce n'est
# plus couvert par la CI ici — voir "Compatibilite" dans README.md.
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '^12.0'
            testbench: '^10.0'
          - php: '8.3'
            laravel: '^12.0'
            testbench: '^10.0'
          - php: '8.4'
            laravel: '^12.0'
            testbench: '^10.0'
          - php: '8.3'
            laravel: '^13.0'
            testbench: '^11.0'
          - php: '8.4'
            laravel: '^13.0'
            testbench: '^11.0'
          # PHP 8.2 + Laravel 13 volontairement absent : Laravel 13 exige
          # PHP ^8.3 minimum, combinaison non installable.

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Fixer les versions Laravel/testbench de cette jambe
        run: composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --with-all-dependencies

      # Attrape les erreurs fatales de parsing (ex: double `use X as Y`) que
      # phpunit ne detecte pas s'il ne charge jamais la classe concernee —
      # cas reel trouve dans workbench/database/factories/UserFactory.php,
      # jamais exercee par la suite de tests elle-meme.
      - name: Syntax check (php -l)
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 -P4 php -l

      - name: Run tests
        run: composer test

      - name: Check code style
        run: composer test:lint
