# Matrice PHP uniquement pour l'instant — toujours contre la même version de
# Laravel (celle qu'`orchestra/testbench ^10.0`, require-dev, résout par
# défaut : Laravel 12 aujourd'hui). PAS encore une vraie matrice multi-Laravel
# (11/12/13) : Laravel 13 exige testbench ^11.0 + PHP ^8.3 minimum (exclut
# PHP 8.2), et au moment d'écrire ceci, `composer audit` bloque par défaut la
# résolution de plusieurs versions de laravel/framework ^11.x pour cause
# d'advisories de sécurité connues — à traiter avant d'ajouter cette jambe à
# la matrice. Voir "Compatibilité" dans README.md pour le détail exact des
# versions supportées vs. réellement testées ici. Contribution bienvenue.
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # Attrape les erreurs fatales de parsing (ex: double `use X as Y`) que
      # phpunit ne détecte pas s'il ne charge jamais la classe concernée —
      # cas réel trouvé dans workbench/database/factories/UserFactory.php,
      # jamais exercée par la suite de tests elle-même.
      - name: Syntax check (php -l)
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 -P4 php -l

      - name: Run tests
        run: composer test

      - name: Check code style
        run: composer test:lint
